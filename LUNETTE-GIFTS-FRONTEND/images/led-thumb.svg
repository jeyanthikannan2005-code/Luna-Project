<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="fairyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A3" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FFD666" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="#241E28"/>
  <!-- Fairy Light String Wire -->
  <path d="M40 100 Q 120 160 200 110 T 360 120" fill="none" stroke="#D1B894" stroke-width="2.5"/>
  <path d="M40 220 Q 130 270 210 220 T 360 240" fill="none" stroke="#D1B894" stroke-width="2.5"/>

  <!-- Glow Points -->
  <circle cx="90" cy="130" r="22" fill="url(#fairyGlow)"/>
  <circle cx="90" cy="130" r="5" fill="#FFFDF0"/>
  <circle cx="160" cy="132" r="22" fill="url(#fairyGlow)"/>
  <circle cx="160" cy="132" r="5" fill="#FFFDF0"/>
  <circle cx="245" cy="115" r="22" fill="url(#fairyGlow)"/>
  <circle cx="245" cy="115" r="5" fill="#FFFDF0"/>
  <circle cx="310" cy="120" r="22" fill="url(#fairyGlow)"/>
  <circle cx="310" cy="120" r="5" fill="#FFFDF0"/>

  <!-- Hanging Polaroid 1 -->
  <g transform="rotate(-5 125 150)">
    <!-- Wooden Peg Clip -->
    <rect x="122" y="130" width="6" height="16" rx="2" fill="#CBB292" stroke="#876846" stroke-width="1"/>
    <!-- Card -->
    <rect x="85" y="145" width="80" height="105" rx="4" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))"/>
    <rect x="91" y="152" width="68" height="70" rx="2" fill="#E892A2" opacity="0.6"/>
    <circle cx="125" cy="180" r="14" fill="#FFE5EB"/>
    <text x="125" y="238" font-family="'Playfair Display', serif" font-size="8" fill="#5A3319" text-anchor="middle">Forever</text>
  </g>

  <!-- Hanging Polaroid 2 -->
  <g transform="rotate(6 250 140)">
    <!-- Wooden Peg Clip -->
    <rect x="247" y="115" width="6" height="16" rx="2" fill="#CBB292" stroke="#876846" stroke-width="1"/>
    <!-- Card -->
    <rect x="210" y="130" width="80" height="105" rx="4" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))"/>
    <rect x="216" y="137" width="68" height="70" rx="2" fill="#7C9D86" opacity="0.6"/>
    <circle cx="250" cy="165" r="14" fill="#E6F2EA"/>
    <text x="250" y="223" font-family="'Playfair Display', serif" font-size="8" fill="#5A3319" text-anchor="middle">Golden Hours</text>
  </g>

  <!-- Warm ambiance text -->
  <text x="200" y="325" font-family="'Playfair Display', serif" font-size="16" fill="#FDF7F2" text-anchor="middle" font-weight="600">LED Fairy Light Polaroids</text>
  <text x="200" y="350" font-family="'Poppins', sans-serif" font-size="12" fill="#E2C4A2" text-anchor="middle">Light ₹150 + ₹7/Card</text>
</svg>
