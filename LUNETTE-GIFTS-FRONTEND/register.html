<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Lunette Gifts</title>
    <link rel="stylesheet" href="./css/boutique-theme.css">
    <style>
        .auth-container {
            max-width: 460px;
            margin: 50px auto;
            padding: 36px 32px;
            background: #FFFFFF;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body style="background-color: var(--bg-ivory);">

    <!-- Header -->
    <header class="site-header">
        <div class="header-container">
            <a href="./" class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M12 2a5 5 0 0 0-5 5c0 4 5 9 5 9s5-5 5-9a5 5 0 0 0-5-5z"/>
                    <circle cx="12" cy="7" r="2"/>
                </svg>
                <div>
                    <span class="brand-title">Lunette Gifts</span>
                    <span class="brand-subtitle">Registration</span>
                </div>
            </a>
            <div class="header-actions">
                <a href="./login.html" class="btn-secondary" style="font-size: 12px; padding: 8px 18px;">➔ Sign In</a>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 32px; margin-bottom: 6px;">🌸</div>
            <h2 style="font-family: 'Playfair Display', serif; font-size: 24px; color: var(--text-main);">Join Lunette Gifts</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Track orders, save favorite keepsakes, and manage your photo gifts</p>
        </div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div style="margin-bottom: 12px;">
                <label style="font-size: 12px; font-weight: 600; color: #2C2523;">Full Name *</label>
                <input type="text" class="input-field" id="reg-name" required placeholder="e.g. Kavya Ramesh">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                <div>
                    <label style="font-size: 12px; font-weight: 600; color: #2C2523;">Username *</label>
                    <input type="text" class="input-field" id="reg-username" required placeholder="kavya">
                </div>
                <div>
                    <label style="font-size: 12px; font-weight: 600; color: #2C2523;">Phone Number *</label>
                    <input type="tel" class="input-field" id="reg-phone" required placeholder="9843210987">
                </div>
            </div>

            <div style="margin-bottom: 12px;">
                <label style="font-size: 12px; font-weight: 600; color: #2C2523;">Email Address</label>
                <input type="email" class="input-field" id="reg-email" placeholder="kavya@example.com">
            </div>

            <div style="margin-bottom: 22px;">
                <label style="font-size: 12px; font-weight: 600; color: #2C2523;">Create Password *</label>
                <input type="password" class="input-field" id="reg-password" required placeholder="At least 6 characters">
            </div>

            <button type="submit" class="btn-primary" id="reg-submit-btn" style="width: 100%; justify-content: center; padding: 14px;">
                Create Account ➔
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
            Already have an account? <a href="./login.html" style="color: var(--rose-500); font-weight: 600;">Sign in here</a>
        </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/boutique.js"></script>
    <script>
        async function handleRegister(event) {
            event.preventDefault();
            const btn = document.getElementById('reg-submit-btn');
            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            const payload = {
                fullName: document.getElementById('reg-name').value.trim(),
                username: document.getElementById('reg-username').value.trim(),
                phone: document.getElementById('reg-phone').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                password: document.getElementById('reg-password').value
            };

            try {
                const res = await fetch(apiUrl('/api/auth/register'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Registration failed');
                }

                const data = await res.json();
                localStorage.setItem('lunette_token', data.token);
                localStorage.setItem('lunette_role', data.role);
                localStorage.setItem('lunette_username', data.username);

                showToast('Welcome to Lunette Gifts! 🌸');
                setTimeout(() => {
                    window.location.href = '/customer/account.html';
                }, 400);
            } catch (e) {
                showToast(e.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Create Account ➔';
            }
        }
    </script>
</body>
</html>
